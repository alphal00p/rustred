[package]
name = "symbolica-arc-mre"
version = "0.1.0"
edition = "2024"
publish = false
description = "Minimal reproducer: multi-thread scaling of Symbolica polynomial operations on polynomials that share one Arc<PolynomialContext>"

# Standalone package: the empty table keeps it out of any surrounding workspace.
[workspace]

[dependencies]
# Default (tested): the crates.io release. Its src/poly/polynomial.rs is identical to upstream `dev`
# 445b882d (the two differ only in src/api.rs and the new poly::reconstruction module, declared in src/poly.rs).
symbolica = { version = "=3.0.0", default-features = false, features = ["integer-gmp", "float-mpfr", "tracing_max_level_info"] }
# The same ahash crate instance as Symbolica's (for --ahash-source thread-local).
ahash = { version = "0.8.7", default-features = false }
libc = "0.2"

# Upstream `dev` instead (the git form below was not tested here, the host builds offline; the measured
# builds used a local clone of dev 445b882d the same way, with
# `path = "<clone>"` and `path = "<clone>/lib/numerica"`, `path = "<clone>/lib/graphica"`):
# [patch.crates-io]
# symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "445b882d" }
# numerica = { git = "https://github.com/symbolica-dev/symbolica", rev = "445b882d" }
# graphica = { git = "https://github.com/symbolica-dev/symbolica", rev = "445b882d" }
# A local checkout, e.g. with patch/proposed.diff applied (+ `--features proposed-api`):
# [patch.crates-io]
# symbolica = { path = "/path/to/symbolica" }
# numerica = { path = "/path/to/symbolica/lib/numerica" }
# graphica = { path = "/path/to/symbolica/lib/graphica" }

[features]
# Symbolica's default global allocator (mimalloc); off by default to match the reporting application.
mimalloc = ["symbolica/faster_alloc"]
# Variant `rehome-api`: needs a Symbolica with patch/proposed.diff applied.
proposed-api = []

[profile.release]
debug = "line-tables-only"
