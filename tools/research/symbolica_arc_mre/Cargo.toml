[package]
name = "symbolica-arc-mre"
version = "0.1.0"
edition = "2024"
publish = false
description = "Minimal reproducer: multi-thread scaling of Symbolica polynomial operations on polynomials that share one Arc<PolynomialContext>"

# Standalone package: the empty table keeps it out of any surrounding workspace.
[workspace]

[dependencies]
# Local checkout (vendored commit 953e26e2 plus an unrelated working-tree patch, see README).
# To use upstream instead, replace the three path entries below, e.g.
#   symbolica = { git = "https://github.com/symbolica-dev/symbolica", branch = "dev", default-features = false, features = [...] }
#   [patch.crates-io] numerica = { git = "https://github.com/symbolica-dev/symbolica", branch = "dev" }
#                     graphica = { git = "https://github.com/symbolica-dev/symbolica", branch = "dev" }
# or a crates.io release: symbolica = { version = "=3.0.0", default-features = false, features = [...] } and no [patch].
symbolica = { path = "../../../vendor/symbolica", default-features = false, features = ["integer-gmp", "float-mpfr", "tracing_max_level_info"] }
libc = "0.2"

[patch.crates-io]
numerica = { path = "../../../vendor/symbolica/lib/numerica" }
graphica = { path = "../../../vendor/symbolica/lib/graphica" }

[features]
# Symbolica's default global allocator (mimalloc); off by default to match the reporting application.
mimalloc = ["symbolica/faster_alloc"]
# Variant `rehome-api`: needs a Symbolica with patch/proposed.diff applied.
proposed-api = []

[profile.release]
debug = "line-tables-only"
