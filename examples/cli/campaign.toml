schema = "rustred.campaign-input.toml.v1"

[[roots]]
id = "tadpole-scalar"
integral = """
I(
  name(tadpole),
  loops(k),
  externals(),
  dimension(d),
  prop(D1,k^2-m2,1)
)
"""

[roots.metadata]
purpose = "scalar validation root"

[[roots]]
id = "tadpole-tensor"
integral = """
I(
  name(tadpole),
  loops(k),
  externals(),
  dimension(d),
  prop(D1,k^2-m2,2),
  numerator(sp(k,k))
)
"""

[roots.metadata]
purpose = "tensor validation root"
