[package]
name = "rustred-proof"
version.workspace = true
authors.workspace = true
edition = "2021"
description = "Proof kernels for stored IBP rules: streaming evaluation, per-instance exact in d, weight-free per-instance span"
license = "MIT"

[lib]
name = "rustred_proof"
path = "src/lib.rs"

[features]
# `engine`: IBP rows generated by RustRed (rustred::solver::SourceSystem), as rr_node does. Without it the crate
# is std only and reads rows from certificates (also buildable with plain rustc, see src/lib.rs).
default = ["engine"]
engine = ["dep:rustred", "wcert"]
# `wcert`: mode weight-cert (independent check of weight certificates, src/wcert/): exact rational-function arithmetic,
# factorisation and Groebner bases by Symbolica (L11). Without `engine` it checks v0 / v0+rows certificates only.
wcert = ["dep:symbolica"]

[dependencies]
rustred = { path = "../rustred-core", optional = true }
# same Symbolica feature set as the engine (crates/rustred-core `native`) and rustred-campaign-algebra
symbolica = { workspace = true, optional = true, features = ["integer-gmp", "float-mpfr"] }

[[bin]]
name = "rr_proof"
path = "src/bin/rr_proof.rs"
