[package]
name = "rustred-app"
version.workspace = true
edition = "2024"
rust-version = "1.89"
description = "Shared application and CLI frontend for RustRed"
license = "MIT"
publish = false

[lib]
name = "rustred_app"
path = "src/lib.rs"

[[bin]]
name = "rustred"
path = "src/main.rs"
doc = false

[dependencies]
rustred = { path = "../rustred-core" }
serde = { version = "1", features = ["derive"] }
symbolica.workspace = true
toml = "1"
