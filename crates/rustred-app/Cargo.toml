[package]
name = "rustred-app"
version.workspace = true
edition = "2024"
rust-version = "1.89"
description = "Shared application and CLI frontend for RustRed"
license = "MIT"
publish = false

[lib]
name = "rustred_app"
path = "src/lib.rs"

[[bin]]
name = "rustred"
path = "src/main.rs"
doc = false

[[example]]
name = "two-loop-single-mass-vacuum"
path = "../../examples/rust/two_loop_single_mass_vacuum.rs"

[dependencies]
rustred = { path = "../rustred-core" }
serde = { version = "1", features = ["derive"] }
symbolica.workspace = true
tabled = { version = "0.21", default-features = false, features = ["ansi", "std"] }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
toml = "1"
