[package]
name = "rustred-campaign-core"
version.workspace = true
authors.workspace = true
edition = "2024"
rust-version = "1.89"
description = "Dependency-light core of the automatic node campaign: keys, polynomials, rule records, case domains, coverage"
license = "MIT"

[lib]
name = "rustred_campaign_core"
path = "src/lib.rs"

# Deliberately dependency-light: no rustred core, no Symbolica.
[dependencies]
rustred-order = { path = "../rustred-order" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
proptest = "1"
