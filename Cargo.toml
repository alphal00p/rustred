[workspace]
members = [
    "crates/rustred-core",
    "crates/rustred-app",
    "crates/rustred-python",
    "crates/rustred-feynkit",
]
default-members = [
    "crates/rustred-core",
    "crates/rustred-app",
    "crates/rustred-python",
]
exclude = [
    "vendor/symbolica",
    "vendor/symbolica/lib/graphica",
    "vendor/symbolica/lib/numerica",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = [
    "Valentin Hirschi <valentin.hirschi@gmail.com>",
    "Gregor Kälin",
]

[workspace.dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
symbolica = { version = "=3.0.0", default-features = false, features = ["integer-gmp", "float-mpfr", "tracing_max_level_info", "bincode"] }

[patch.crates-io]
symbolica = { path = "vendor/symbolica" }
graphica = { path = "vendor/symbolica/lib/graphica" }
numerica = { path = "vendor/symbolica/lib/numerica" }
