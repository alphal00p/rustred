[workspace]
members = [
    "crates/rustred-core",
    "crates/rustred-app",
    "crates/rustred-python",
]
default-members = [
    "crates/rustred-core",
    "crates/rustred-app",
    "crates/rustred-python",
]
exclude = [
    "vendor/symbolica",
    "vendor/symbolica/lib/graphica",
    "vendor/symbolica/lib/numerica",
]
resolver = "3"

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
symbolica = { version = "=2.2.0", default-features = false, features = ["gmp", "tracing_max_level_info"] }

[patch.crates-io]
symbolica = { path = "vendor/symbolica" }
graphica = { path = "vendor/symbolica/lib/graphica" }
numerica = { path = "vendor/symbolica/lib/numerica" }
