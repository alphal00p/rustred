[workspace]
# The root package is an implicit workspace member. Listing `.` explicitly
# would make every nested path an explicit member prefix in Cargo, defeating
# the vendor exclusions below.
members = ["crates/rustred-app", "crates/rustred-python"]
default-members = [".", "crates/rustred-app", "crates/rustred-python"]
exclude = [
    "vendor/gammaloop",
    "vendor/symbolica",
    "vendor/symbolica/lib/graphica",
    "vendor/symbolica/lib/numerica",
]
resolver = "3"

[workspace.package]
version = "0.1.0"

[package]
name = "rustred"
version.workspace = true
edition = "2024"
rust-version = "1.89"
description = "Pure-Rust parametric IBP reductions for multiloop Feynman integrals"
license = "MIT"
build = "build.rs"
exclude = [
    "FOR_REFERENCE_ONLY_DO_NOT_PUSH/**",
    "GOAL.md",
    "HANDOFF.md",
    "docs/research/**",
]

[lib]
name = "rustred"
path = "src/lib.rs"

[[example]]
name = "four_loop_next_elimination"
required-features = ["legacy-authored-oracles"]

[[example]]
name = "four_loop_next_modular_rank"
required-features = ["legacy-authored-oracles"]

[[example]]
name = "four_loop_three_loop_closure_probe"
required-features = ["legacy-authored-oracles"]

[[example]]
name = "four_loop_three_loop_target_census"
required-features = ["legacy-authored-oracles"]

[features]
default = []
legacy-authored-oracles = []

[dependencies]
rand = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
symbolica = { path = "vendor/symbolica", default-features = false, features = ["gmp", "tracing_max_level_info"] }
toml = "1"

[build-dependencies]
toml = "1"

[patch.crates-io]
graphica = { path = "vendor/symbolica/lib/graphica" }
numerica = { path = "vendor/symbolica/lib/numerica" }
